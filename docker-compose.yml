services:
  # --- Operational Database (OLTP) with pgvector ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medusa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: medusa_luxury
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis for Medusa caching & event queue ---
  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- ClickHouse Analytical Engine (OLAP) for Shopify-grade metrics ---
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: ecommerce-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123" # HTTP Interface for Web / Ingestion
      - "9004:9000" # Native TCP Client (remaped to 9004 so port 9000 remains free for Medusa)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./analytics/clickhouse-init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
